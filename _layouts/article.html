---
layout: reading
---

<main class="article-outer">
  <header class="art-header">
    <div class="art-date">{{ page.date | date: "%B %-d, %Y" }}</div>
    <h1 class="art-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="art-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    <hr class="art-header-rule" />
  </header>

  <div class="art-body">{{ content }}</div>
</main>
