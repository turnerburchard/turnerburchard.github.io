use_bootstrap_js: true
page_script: /js/gallery.js
---

<div class="container mt-4" id="galleryPageContainer">
    <ul class="nav nav-tabs" id="galleryTab" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="photos-tab" data-toggle="tab" href="#photos" role="tab" aria-controls="photos" aria-selected="true">Photos</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="wildlife-tab" data-toggle="tab" href="#wildlife" role="tab" aria-controls="wildlife" aria-selected="false">Wildlife</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="me-tab" data-toggle="tab" href="#me" role="tab" aria-controls="me" aria-selected="false">Me</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="art-tab" data-toggle="tab" href="#art" role="tab" aria-controls="art" aria-selected="false">Art</a>
        </li>
    </ul>

    <div class="tab-content" id="galleryTabContent">
        <div class="tab-pane fade show active" id="photos" role="tabpanel" aria-labelledby="photos-tab">
            <div class="gallery-container mt-3"></div>
        </div>
        <div class="tab-pane fade" id="wildlife" role="tabpanel" aria-labelledby="wildlife-tab">
            <div class="gallery-container mt-3"></div>
        </div>
        <div class="tab-pane fade" id="me" role="tabpanel" aria-labelledby="me-tab">
            <div class="gallery-container mt-3"></div>
        </div>
        <div class="tab-pane fade" id="art" role="tabpanel" aria-labelledby="art-tab">
            <div class="gallery-container mt-3"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="galleryModal" tabindex="-1" aria-labelledby="galleryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <img src="" id="modalImage" class="img-fluid modal-gallery-image" alt="Full size image">
            </div>
        </div>
    </div>
</div>
