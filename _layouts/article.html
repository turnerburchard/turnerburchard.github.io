<!DOCTYPE html>
<html lang="en">
<head>
    {% include meta.html %}
    <title>{{ page.title }} — Turner Burchard</title>
    <link rel="stylesheet" href="/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #faf8f4;
            color: #1a1a1a;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .article-outer {
            max-width: 1080px;
            margin: 0 auto;
            padding: 3rem 1.5rem 6rem;
        }

        /* Header stays in reading column */
        .art-header {
            max-width: 680px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            font-family: 'Raleway', sans-serif;
            font-size: 0.875rem;
            color: #2b413d;
            text-decoration: none;
            margin-bottom: 2.5rem;
        }
        .back:hover { text-decoration: underline; }

        .art-date {
            font-family: 'Raleway', sans-serif;
            font-size: 0.8125rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 0.75rem;
        }
        .art-title {
            font-size: 2.4rem;
            font-weight: normal;
            line-height: 1.2;
            color: #111;
            margin-bottom: 0.8rem;
        }
        .art-subtitle {
            font-size: 1.125rem;
            font-style: italic;
            color: #666;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .art-header-rule {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin-bottom: 2.5rem;
        }

        .art-body {
            font-size: 1.125rem;
            line-height: 1.8;
            color: #1a1a1a;
        }

        /* Reading column: constrain block children to 680px */
        .art-body > * {
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
        }

        .art-body p { margin-bottom: 1.5rem; }
        .art-body h2 {
            font-size: 1.35rem;
            font-weight: normal;
            color: #111;
            margin-top: 2.75rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        .art-body hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin-top: 2.5rem;
            margin-bottom: 2.5rem;
        }
        .art-body a { color: #2b413d; }
        .art-body strong { font-weight: bold; }

        /* Figures break out wider than the text column */
        .art-body figure {
            max-width: 1000px;
            margin-top: 4rem;
            margin-bottom: 4rem;
        }
        .art-body figure img {
            width: 100%;
            height: auto;
            display: block;
        }
        .art-body figcaption {
            font-family: 'Raleway', sans-serif;
            font-size: 0.8125rem;
            color: #888;
            margin-top: 0.75rem;
            line-height: 1.5;
            text-align: left;
        }

        @media (max-width: 600px) {
            .art-title { font-size: 1.85rem; }
            .article-outer { padding: 2rem 1.25rem 4rem; }
            .art-body figure {
                margin-top: 2.5rem;
                margin-bottom: 2.5rem;
            }
        }
    </style>

    <script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<header class="article-top">
    <a href="/articles/">Turner Burchard</a>
</header>

<main class="article-outer">
    <header class="art-header">
        <div class="art-date">{{ page.date | date: "%B %-d, %Y" }}</div>
        <h1 class="art-title">{{ page.title }}</h1>
        {% if page.subtitle %}<p class="art-subtitle">{{ page.subtitle }}</p>{% endif %}
        <hr class="art-header-rule">
    </header>

    <div class="art-body">
        {{ content }}
    </div>
</main>

<footer class="article-bottom">
    <p>Turner Burchard</p>
</footer>

</body>
</html>
